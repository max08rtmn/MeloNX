name: iOS unsigned IPA
run-name: iOS unsigned IPA (${{ github.ref_name }})

on:
  workflow_dispatch:
  push:
    branches:
      - XC-ios-ht
      - main
      - master
    paths:
      - ".github/workflows/**"
      - "MeloNX-XC-ios-ht.zip"
      - "NativeController.swift"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - "src/**"
      - "distribution/ios/**"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ZIP: MeloNX-XC-ios-ht.zip
  SOURCE_ROOT: .
  XCODE_PROJECT: src/MeloNX/MeloNX.xcodeproj
  XCODE_SCHEME: MeloNX
  XCODE_CONFIGURATION: Release
  DERIVED_DATA_PATH: build/DerivedData
  IPA_OUTPUT_DIR: build/ipa
  RESULT_BUNDLE_PATH: build/MeloNX.xcresult

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Start timer
        id: timer
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare source tree
        run: |
          set -euo pipefail

          source_root="$PWD"
          if [ -f "$SOURCE_ZIP" ] && [ ! -d "src/MeloNX" ]; then
            echo "Entpacke $SOURCE_ZIP"
            rm -rf _source
            mkdir -p _source
            unzip -q "$SOURCE_ZIP" -d _source

            project_path="$(find _source -name 'MeloNX.xcodeproj' -type d -print -quit)"
            if [ -z "$project_path" ]; then
              echo "MeloNX.xcodeproj wurde in $SOURCE_ZIP nicht gefunden." >&2
              find _source -maxdepth 4 -type d | sort
              exit 66
            fi

            source_root="$(cd "$(dirname "$project_path")/../.." && pwd)"
          fi

          if [ -f "$GITHUB_WORKSPACE/NativeController.swift" ]; then
            target="$source_root/src/MeloNX/MeloNX/App/Core/Controllers/NativeController.swift"
            if [ ! -f "$target" ]; then
              echo "NativeController-Ziel wurde nicht gefunden: $target" >&2
              exit 66
            fi
            cp "$GITHUB_WORKSPACE/NativeController.swift" "$target"
            echo "NativeController.swift aus dem Repo-Hauptordner wurde in den Quellcode kopiert."
          fi

          if [ ! -f "$source_root/global.json" ]; then
            echo "global.json wurde im Quellcode-Root nicht gefunden: $source_root" >&2
            exit 66
          fi

          cp "$source_root/global.json" "$GITHUB_WORKSPACE/global.json"

          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          echo "XCODE_PROJECT=$source_root/src/MeloNX/MeloNX.xcodeproj" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$source_root/build/DerivedData" >> "$GITHUB_ENV"
          echo "IPA_OUTPUT_DIR=$source_root/build/ipa" >> "$GITHUB_ENV"
          echo "RESULT_BUNDLE_PATH=$source_root/build/MeloNX.xcresult" >> "$GITHUB_ENV"
          echo "Quellcode-Root: $source_root"

      - name: Select Xcode
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print | sort -V | tail -n 1)"
          if [ -z "$selected_xcode" ]; then
            echo "No Xcode installation found" >&2
            exit 1
          fi
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          echo "Selected Xcode: $selected_xcode"
          xcodebuild -version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('MeloNX-XC-ios-ht.zip', 'Directory.Packages.props', 'nuget.config', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Check NativeController
        run: |
          set -euo pipefail
          native="$SOURCE_ROOT/src/MeloNX/MeloNX/App/Core/Controllers/NativeController.swift"
          if grep -q "JoyConFix NativeController loaded" "$native"; then
            echo "JoyConFix-Marker in NativeController.swift gefunden."
          else
            echo "::warning::JoyConFix-Marker nicht gefunden. Die IPA wird dann ohne deinen Controller-Fix gebaut."
          fi

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -resolvePackageDependencies

      - name: Build unsigned app
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          libdeps="$SOURCE_ROOT/build/libdeps"
          mkdir -p build
          ln -sfn "$SOURCE_ROOT/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries" "$libdeps"
          rm -rf "$RESULT_BUNDLE_PATH"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            "LIBRARY_SEARCH_PATHS=\$(inherited) $libdeps" \
            "OTHER_LDFLAGS=\$(inherited) $libdeps/Ryujinx.Headless.SDL2.dylib"

      - name: Collect Xcode diagnostics
        if: failure()
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          mkdir -p build/diagnostics
          if [ -d "$RESULT_BUNDLE_PATH" ]; then
            xcrun xcresulttool get --path "$RESULT_BUNDLE_PATH" --format json --legacy > build/diagnostics/xcresult.json || true
          fi
          if [ -d "$DERIVED_DATA_PATH/Logs" ]; then
            ditto "$DERIVED_DATA_PATH/Logs" build/diagnostics/Logs
          fi

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-xcode-diagnostics
          path: |
            ${{ env.RESULT_BUNDLE_PATH }}
            ${{ env.SOURCE_ROOT }}/build/diagnostics
          if-no-files-found: warn

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          app_path="$(find "$DERIVED_DATA_PATH/Build/Products/${XCODE_CONFIGURATION}-iphoneos" -maxdepth 1 -name 'MeloNX.app' -type d -print -quit)"
          if [ -z "$app_path" ]; then
            echo "MeloNX.app was not produced" >&2
            exit 1
          fi

          ryujinx_dylib="$SOURCE_ROOT/src/MeloNX/MeloNX/Dependencies/Dynamic Libraries/Ryujinx.Headless.SDL2.dylib"
          if [ ! -f "$ryujinx_dylib" ]; then
            ryujinx_dylib="$(find "$SOURCE_ROOT/src/Ryujinx.Headless.SDL2" "$SOURCE_ROOT/src/MeloNX/MeloNX/Dependencies" -name 'Ryujinx.Headless.SDL2.dylib' -type f -print -quit)"
          fi
          if [ -z "$ryujinx_dylib" ] || [ ! -f "$ryujinx_dylib" ]; then
            echo "Ryujinx.Headless.SDL2.dylib was not produced" >&2
            exit 1
          fi

          mkdir -p "$app_path/Frameworks"
          ditto "$ryujinx_dylib" "$app_path/Frameworks/Ryujinx.Headless.SDL2.dylib"
          chmod 755 "$app_path/Frameworks/Ryujinx.Headless.SDL2.dylib"
          test -f "$app_path/Frameworks/Ryujinx.Headless.SDL2.dylib"

          rm -rf "$IPA_OUTPUT_DIR"
          mkdir -p "$IPA_OUTPUT_DIR/Payload"
          ditto "$app_path" "$IPA_OUTPUT_DIR/Payload/MeloNX.app"
          test -f "$IPA_OUTPUT_DIR/Payload/MeloNX.app/Frameworks/Ryujinx.Headless.SDL2.dylib"
          ditto "$SOURCE_ROOT/src/MeloNX/MeloNX/MeloNX.entitlements" "$IPA_OUTPUT_DIR/MeloNX-signing-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.wifi-aware" "$IPA_OUTPUT_DIR/MeloNX-signing-entitlements.plist"
          (cd "$IPA_OUTPUT_DIR" && zip -qry MeloNX-unsigned.ipa Payload)
          du -sh "$IPA_OUTPUT_DIR/MeloNX-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-unsigned-ipa
          path: |
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-unsigned.ipa
            ${{ env.IPA_OUTPUT_DIR }}/MeloNX-signing-entitlements.plist
          if-no-files-found: error

      - name: Report duration
        if: always()
        run: |
          finished_at="$(date +%s)"
          elapsed="$((finished_at - ${{ steps.timer.outputs.started_at }}))"
          {
            echo "## iOS unsigned IPA build"
            echo
            echo "- Elapsed seconds: $elapsed"
            echo "- Elapsed minutes: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Runner: $RUNNER_OS / $RUNNER_ARCH"
          } >> "$GITHUB_STEP_SUMMARY"
